<!DOCTYPE html>
<html>
<head>
    <title>SSE Connection Test</title>
</head>
<body>
    <h1>SSE Connection Debug Test</h1>
    <div id="status">Initializing...</div>
    <div id="messages"></div>
    
    <script>
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        
        function addMessage(msg) {
            const p = document.createElement('p');
            p.textContent = new Date().toISOString() + ': ' + msg;
            messagesDiv.appendChild(p);
            console.log(msg);
        }
        
        async function testSSEConnection() {
            try {
                addMessage('🔄 Starting SSE connection test...');
                
                // First test: Get JWT token
                statusDiv.textContent = 'Getting JWT token...';
                const tokenResponse = await fetch('/api/auth/jwt-token', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (!tokenResponse.ok) {
                    throw new Error(`JWT token failed: ${tokenResponse.status}`);
                }
                
                const { token } = await tokenResponse.json();
                addMessage('✅ Got JWT token: ' + token.substring(0, 50) + '...');
                
                // Second test: Create a blog task
                statusDiv.textContent = 'Creating blog task...';
                const taskResponse = await fetch('/api/generate-blog', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        topic: 'SSE Browser Test',
                        instructions: 'Test blog for SSE connection debugging'
                    })
                });
                
                if (!taskResponse.ok) {
                    throw new Error(`Task creation failed: ${taskResponse.status}`);
                }
                
                const taskData = await taskResponse.json();
                const taskId = taskData.task_id;
                addMessage('✅ Created task: ' + taskId);
                
                // Third test: Connect to SSE stream
                statusDiv.textContent = 'Connecting to SSE stream...';
                const streamUrl = `https://localhost:5000/stream/${taskId}?token=${encodeURIComponent(token)}`;
                addMessage('🔗 SSE URL: ' + streamUrl);
                
                const eventSource = new EventSource(streamUrl);
                
                eventSource.onopen = function(event) {
                    addMessage('✅ SSE connection opened!');
                    statusDiv.textContent = 'Connected to SSE stream';
                };
                
                eventSource.onmessage = function(event) {
                    addMessage('📨 SSE message: ' + event.data);
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'connected') {
                            addMessage('🎉 Connection acknowledged!');
                        }
                    } catch (e) {
                        addMessage('⚠️ Could not parse message: ' + e.message);
                    }
                };
                
                eventSource.onerror = function(event) {
                    addMessage('❌ SSE error occurred');
                    addMessage('Error event: ' + JSON.stringify({
                        readyState: eventSource.readyState,
                        type: event.type,
                        target: event.target ? 'EventSource' : 'null'
                    }));
                    
                    if (eventSource.readyState === EventSource.CLOSED) {
                        addMessage('💀 Connection closed');
                        statusDiv.textContent = 'Connection failed';
                    }
                };
                
                // Close connection after 10 seconds
                setTimeout(() => {
                    if (eventSource.readyState !== EventSource.CLOSED) {
                        addMessage('⏰ Closing connection after 10 seconds');
                        eventSource.close();
                        statusDiv.textContent = 'Test completed';
                    }
                }, 10000);
                
            } catch (error) {
                addMessage('💥 Test failed: ' + error.message);
                statusDiv.textContent = 'Test failed: ' + error.message;
            }
        }
        
        // Run the test when page loads
        window.addEventListener('load', testSSEConnection);
    </script>
</body>
</html>
