version: '3.8'

services:
  backend-staging:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bloggen-backend-staging
    ports:
      - "8080:8080"  # Staging uses 8080 (same as production)
    environment:
      - PORT=8080
      - NODE_ENV=staging
      - RAILWAY_ENVIRONMENT=staging
    env_file:
      - ./backend/.env.staging
    networks:
      - bloggen-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend-staging:
    build:
      context: ./frontend-nextjs/blog-generator-ui
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_PROTOCOL_MODE=http
        - NEXT_PUBLIC_FRONTEND_HOST=localhost
        - NEXT_PUBLIC_FRONTEND_PORT=3000
        - NEXT_PUBLIC_BACKEND_HOST=localhost
        - NEXT_PUBLIC_BACKEND_PORT=8080
        - NEXT_PUBLIC_API_URL=http://localhost:8080
    container_name: bloggen-frontend-staging
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=staging
      # Browser (client-side) needs to access backend via localhost:8080
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_PROTOCOL_MODE=http
      - NEXT_PUBLIC_BACKEND_HOST=localhost
      - NEXT_PUBLIC_BACKEND_PORT=8080
      # Server-side API routes need to use Docker service name
      - API_BASE_URL=http://backend-staging:8080
    env_file:
      - ./frontend-nextjs/blog-generator-ui/.env.staging
    depends_on:
      backend-staging:
        condition: service_healthy
    networks:
      - bloggen-staging-network
    restart: unless-stopped

networks:
  bloggen-staging-network:
    driver: bridge
