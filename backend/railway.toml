[build]
# Use Dockerfile for build
builder = "DOCKERFILE"
# Dockerfile is in the backend root directory (Railway root is set to /backend)
dockerfilePath = "./Dockerfile"

[deploy]
# Let Dockerfile CMD handle startup (don't override with startCommand)
# Railway uses /backend as root directory
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
sleepApplication = false
numReplicas = 1

[env]
# Force unbuffered output for better logging
PYTHONUNBUFFERED = "1"
