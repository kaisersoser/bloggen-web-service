[build]
# Use default Railpack builder

[deploy]
# Start from project root, so we need to specify full path
startCommand = "cd backend && python src/main.py"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
sleepApplication = false
numReplicas = 1

[env]
# Force unbuffered output for better logging
PYTHONUNBUFFERED = "1"
