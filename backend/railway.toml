[build]
# Use Dockerfile for build
builder = "DOCKERFILE"
# Since Railway root directory is /backend, just use filename
# dockerfilePath = "Dockerfile"

[deploy]
# Let Dockerfile CMD handle startup (don't override with startCommand)
# Railway uses /backend as root directory
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
sleepApplication = false
numReplicas = 1

[env]
# Force unbuffered output for better logging
PYTHONUNBUFFERED = "1"
