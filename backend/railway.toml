[build]
# Use default Railpack builder (auto-detects Dockerfile)
builder = "DOCKERFILE"

[deploy]
# Railway uses /backend as root directory, code is in /app/src/
# Use startup script for better error logging
startCommand = "chmod +x /app/start.sh && /app/start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
sleepApplication = false
numReplicas = 1

[env]
# Force unbuffered output for better logging
PYTHONUNBUFFERED = "1"
