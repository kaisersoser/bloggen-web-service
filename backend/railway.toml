[build]
# Use default Railpack builder

[deploy]
# Railway uses /backend as root directory, code is in /app/src/
# Set PYTHONPATH so Python can find config/, core/, etc. modules
startCommand = "cd /app && PYTHONPATH=/app/src python src/main.py"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
sleepApplication = false
numReplicas = 1

[env]
# Force unbuffered output for better logging
PYTHONUNBUFFERED = "1"
