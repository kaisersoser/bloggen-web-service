<!DOCTYPE html>
<html>
<head>
    <title>WebSocket HTTP Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background-color: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>WebSocket HTTP Connection Test</h1>
    <p>Testing WebSocket connection to <strong>ws://localhost:5000</strong></p>
    
    <button onclick="testWebSocketConnection()">Test WebSocket Connection</button>
    <button onclick="clearLogs()">Clear Logs</button>
    
    <div id="logs"></div>

    <script>
        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.innerHTML = `[${timestamp}] ${message}`;
            logs.appendChild(logDiv);
            logs.scrollTop = logs.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        async function testWebSocketConnection() {
            log('Starting WebSocket HTTP connection test...', 'info');
            
            try {
                // Step 1: Get JWT token
                log('Step 1: Getting JWT token from frontend...', 'info');
                const tokenResponse = await fetch('http://localhost:3001/api/auth/jwt-token', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (!tokenResponse.ok) {
                    throw new Error(`Failed to get JWT token: ${tokenResponse.status} ${tokenResponse.statusText}`);
                }
                
                const { token } = await tokenResponse.json();
                log('✅ JWT token obtained successfully', 'success');
                
                // Step 2: Test WebSocket connection
                log('Step 2: Connecting to WebSocket (HTTP mode)...', 'info');
                const wsUrl = `ws://localhost:5000/ws/test-task-id?token=${encodeURIComponent(token)}`;
                log(`Connecting to: ${wsUrl}`, 'info');
                
                const websocket = new WebSocket(wsUrl);
                
                websocket.onopen = function(event) {
                    log('✅ WebSocket connection opened successfully!', 'success');
                    log('Connection is working in HTTP mode', 'success');
                    
                    // Send a test message
                    websocket.send(JSON.stringify({
                        type: 'test',
                        message: 'Hello from HTTP WebSocket client'
                    }));
                };
                
                websocket.onmessage = function(event) {
                    log(`📨 Received message: ${event.data}`, 'success');
                };
                
                websocket.onerror = function(error) {
                    log(`❌ WebSocket error: ${error}`, 'error');
                    console.error('WebSocket error:', error);
                };
                
                websocket.onclose = function(event) {
                    log(`WebSocket closed. Code: ${event.code}, Reason: ${event.reason}`, 'info');
                };
                
                // Close connection after 5 seconds
                setTimeout(() => {
                    if (websocket.readyState === WebSocket.OPEN) {
                        websocket.close(1000, 'Test completed');
                        log('Test completed - connection closed normally', 'info');
                    }
                }, 5000);
                
            } catch (error) {
                log(`❌ Error during test: ${error.message}`, 'error');
                console.error('Test error:', error);
            }
        }

        // Auto-start test when page loads
        window.onload = function() {
            log('WebSocket HTTP Test Page Loaded', 'info');
            log('Click "Test WebSocket Connection" to start the test', 'info');
        };
    </script>
</body>
</html>
