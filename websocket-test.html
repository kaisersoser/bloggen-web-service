<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #log { background: #f8f9fa; padding: 15px; border-radius: 5px; height: 400px; overflow-y: scroll; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>WebSocket SSL Certificate Test</h1>
    
    <div class="status info">
        <strong>Step 1:</strong> Visit <a href="https://localhost:5000/health" target="_blank">https://localhost:5000/health</a> and accept the SSL certificate.
    </div>
    
    <div class="status info">
        <strong>Step 2:</strong> Click the test button below to verify WebSocket connections work.
    </div>
    
    <button onclick="testWebSocket()">Test WebSocket Connection</button>
    <button onclick="clearLog()">Clear Log</button>
    
    <h3>Connection Log:</h3>
    <div id="log">Click 'Test WebSocket Connection' to start...\n</div>

    <script>
        const log = document.getElementById('log');
        
        function addLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            log.textContent += `[${timestamp}] ${message}\n`;
            log.scrollTop = log.scrollHeight;
        }
        
        function clearLog() {
            log.textContent = '';
        }
        
        function testWebSocket() {
            addLog('Starting WebSocket test...');
            
            // Test WebSocket connection to backend
            const wsUrl = 'wss://localhost:5000/ws/test-connection';
            addLog(`Connecting to: ${wsUrl}`);
            
            const ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                addLog('✅ WebSocket connection opened successfully!');
                addLog('🎉 SSL certificate is trusted by browser');
                
                // Close connection after successful test
                setTimeout(() => {
                    ws.close(1000, 'Test completed');
                    addLog('Connection closed - test complete');
                }, 2000);
            };
            
            ws.onmessage = function(event) {
                addLog(`📥 Received: ${event.data}`);
            };
            
            ws.onclose = function(event) {
                if (event.code === 1000) {
                    addLog(`Connection closed cleanly (${event.code}): ${event.reason}`);
                } else {
                    addLog(`❌ Connection closed with error (${event.code}): ${event.reason}`);
                }
            };
            
            ws.onerror = function(error) {
                addLog('❌ WebSocket error occurred:');
                addLog('   This usually means the SSL certificate is not trusted');
                addLog('   Make sure you visited https://localhost:5000/health and accepted the certificate');
                console.error('WebSocket error:', error);
            };
            
            // Timeout after 10 seconds
            setTimeout(() => {
                if (ws.readyState === WebSocket.CONNECTING) {
                    addLog('⏰ Connection timeout - likely SSL certificate not accepted');
                    ws.close();
                }
            }, 10000);
        }
        
        // Auto-test on page load
        setTimeout(testWebSocket, 1000);
    </script>
</body>
</html>
